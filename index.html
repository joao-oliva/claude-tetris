<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle" for="theme-toggle" title="Cambiar tema">
        <span class="theme-icon">🌙</span>
        <input type="checkbox" id="theme-toggle" />
        <span class="theme-switch"></span>
        <span class="theme-icon">☀️</span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">TINTE EN</span>
          <span class="value" id="tint-countdown">20</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div class="records-stats">
          <span>Mejor combo: <strong id="best-combo-overlay">0</strong></span>
          <span>Líneas máx: <strong id="max-lines-overlay">0</strong></span>
        </div>
        <div id="save-score-form" class="hidden">
          <input type="text" id="player-name" placeholder="Tu nombre" maxlength="16" />
          <button id="save-score-btn">Guardar puntuación</button>
        </div>
        <ol class="records-list" id="records-list"></ol>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div class="records-stats">
          <span>Mejor combo: <strong id="best-combo-start">0</strong></span>
          <span>Líneas máx: <strong id="max-lines-start">0</strong></span>
        </div>
        <ol class="records-list" id="records-list-start"></ol>
        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
